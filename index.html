<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUAING - WMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body { font-family: 'Inter', sans-serif; }
      @media print {
        body * { visibility: hidden; }
        #printable-report, #printable-report * { visibility: visible; }
        #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem("gss_url") || "");
            const [isConfigOpen, setIsConfigOpen] = useState(false);
            const [tempUrl, setTempUrl] = useState(webAppUrl);
            const [syncStatus, setSyncStatus] = useState("idle"); 

            const [activeTab, setActiveTab] = useState("dashboard");
            
            const [products, setProducts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [opnameCounts, setOpnameCounts] = useState({});
            
            // Modal States
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [editingProduct, setEditingProduct] = useState({ id: "", name: "", category: "Cat Food", unit: "BAL", stock: 0, minStock: 10 });
            
            const [newProduct, setNewProduct] = useState({ name: "", category: "Cat Food", unit: "BAL", stock: 0, minStock: 10 });
            const [searchTerm, setSearchTerm] = useState("");

            const [trxForm, setTrxForm] = useState({ type: "IN", productName: "", qty: 1, partner: "", note: "" });

            const [reportType, setReportType] = useState("master");
            const [startDate, setStartDate] = useState("2026-11-01");
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);

            const isDateValid = useMemo(() => {
                if (reportType === 'master') return true;
                if (!startDate || !endDate) return false;
                if (startDate > endDate) return false;
                return true;
            }, [reportType, startDate, endDate]);

            useEffect(() => {
                if (webAppUrl) {
                    fetchDataFromSheets(webAppUrl);
                } else {
                    setIsConfigOpen(true);
                }
            }, [webAppUrl]);

            const saveConfigUrl = () => {
                setWebAppUrl(tempUrl);
                localStorage.setItem("gss_url", tempUrl);
                setIsConfigOpen(false);
                if(tempUrl) fetchDataFromSheets(tempUrl);
            };

            const fetchDataFromSheets = async (customUrl = webAppUrl) => {
                if (!customUrl) return;
                setSyncStatus("syncing");
                try {
                    const res = await fetch(customUrl);
                    const data = await res.json();
                    if (data && data.products) setProducts(data.products);
                    if (data && data.transactions) setTransactions(data.transactions);
                    setSyncStatus("success");
                    setTimeout(() => setSyncStatus("idle"), 3000);
                } catch (err) {
                    console.error("Gagal sinkronisasi Google Sheets:", err);
                    setSyncStatus("error");
                    setTimeout(() => setSyncStatus("idle"), 3000);
                }
            };

            const sendDataToSheets = async (action, dataPayload) => {
                if (!webAppUrl) return;
                try {
                    await fetch(webAppUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action, data: dataPayload })
                    });
                } catch (err) {
                    console.error("Gagal mengirim data ke Google Sheets:", err);
                }
            };

            const handleAddProductSubmit = (e) => {
                e.preventDefault();
                if (!newProduct.name) return;
                const newItem = {
                    id: "PRD-" + Date.now().toString().slice(-4),
                    name: newProduct.name.toUpperCase(),
                    category: newProduct.category,
                    unit: newProduct.unit,
                    stock: Number(newProduct.stock),
                    minStock: Number(newProduct.minStock)
                };

                setProducts(prev => [...prev, newItem]);
                sendDataToSheets("ADD_PRODUCT", newItem);
                setNewProduct({ name: "", category: "Cat Food", unit: "BAL", stock: 0, minStock: 10 });
                setIsAddModalOpen(false);
            };

            // PERBAIKAN UTAMA: Handler Edit Produk
            const handleOpenEditModal = (product) => {
                setEditingProduct({ ...product }); // Salin objek agar aman diedit
                setIsEditModalOpen(true);
            };

            const handleUpdateProduct = (e) => {
                e.preventDefault();
                if (!editingProduct || !editingProduct.id) return;
                
                const updatedProducts = products.map(p => p.id === editingProduct.id ? {
                    ...editingProduct,
                    name: editingProduct.name.toUpperCase(),
                    stock: Number(editingProduct.stock),
                    minStock: Number(editingProduct.minStock)
                } : p);

                setProducts(updatedProducts);
                sendDataToSheets("UPDATE_PRODUCT", editingProduct);
                setIsEditModalOpen(false);
                setEditingProduct({ id: "", name: "", category: "Cat Food", unit: "BAL", stock: 0, minStock: 10 });
                alert("Data barang berhasil diperbarui!");
            };

            const handleDeleteProduct = (id, name) => {
                if (confirm(`Yakin ingin menghapus ${name}?`)) {
                    setProducts(products.filter(p => p.id !== id));
                    sendDataToSheets("DELETE_PRODUCT", { id });
                }
            };

            const handleTransactionSubmit = (e) => {
                e.preventDefault();
                if (!trxForm.productName || trxForm.qty <= 0) return;

                const qtyNum = Number(trxForm.qty);
                const newTrx = {
                    id: `TRX-${Date.now().toString().slice(-4)}`,
                    date: new Date().toISOString().split('T')[0],
                    type: trxForm.type,
                    productName: trxForm.productName,
                    qty: qtyNum,
                    unit: products.find(p => p.name === trxForm.productName)?.unit || "BAL",
                    partner: trxForm.partner || (trxForm.type === 'IN' ? 'Supplier Umum' : 'Pelanggan Umum'),
                    note: trxForm.note || '-'
                };

                const updatedProducts = products.map(p => {
                    if (p.name === trxForm.productName) {
                        const newStock = trxForm.type === 'IN' ? Number(p.stock) + qtyNum : Number(p.stock) - qtyNum;
                        return { ...p, stock: Math.max(0, newStock) };
                    }
                    return p;
                });

                setProducts(updatedProducts);
                setTransactions(prev => [newTrx, ...prev]);
                sendDataToSheets("ADD_TRANSACTION", newTrx);

                alert("Transaksi berhasil disimpan dan stok otomatis diperbarui!");
                setTrxForm({ type: "IN", productName: "", qty: 1, partner: "", note: "" });
            };

            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const matchDate = t.date >= startDate && t.date <= endDate;
                    const matchType = reportType === 'all' || 
                                      (reportType === 'in' && t.type === 'IN') || 
                                      (reportType === 'out' && t.type === 'OUT');
                    return matchDate && (reportType === 'master' || matchType);
                });
            }, [transactions, startDate, endDate, reportType]);

            const exportToCSV = () => {
                if (!isDateValid) return;
                let csvContent = "data:text/csv;charset=utf-8,";
                if (reportType === 'master') {
                    csvContent += "ID,Nama Barang,Kategori,Satuan,Stok,Min Stok,Status\n";
                    products.forEach(p => {
                        const status = Number(p.stock) <= Number(p.minStock) ? "RESTOCK" : "AMAN";
                        csvContent += `${p.id},"${p.name}",${p.category},${p.unit},${p.stock},${p.minStock},${status}\n`;
                    });
                } else {
                    csvContent += "ID Trx,Tanggal,Tipe,Nama Barang,Qty,Satuan,Pihak Terkait,Keterangan\n";
                    filteredTransactions.forEach(t => {
                        csvContent += `${t.id},${t.date},${t.type},"${t.productName}",${t.qty},${t.unit},"${t.partner}","${t.note}"\n`;
                    });
                }
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Laporan_${reportType.toUpperCase()}_${startDate}_to_${endDate}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-lg text-white font-bold">NU</div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">Warehouse Management System</h1>
                                    <p className="text-xs text-slate-400">Database Connected Google</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsConfigOpen(true)} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium border border-slate-700 transition cursor-pointer">
                                    <span>{webAppUrl ? "🟢 Terhubung Sheets" : "🔴 Atur URL Sheets"}</span>
                                </button>
                                {webAppUrl && (
                                    <button onClick={() => fetchDataFromSheets()} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-xs font-medium transition cursor-pointer">
                                        {syncStatus === 'syncing' ? 'Memuat...' : 'Refresh Data'}
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="bg-slate-950 border-t border-slate-800 px-4">
                            <div className="max-w-7xl mx-auto flex overflow-x-auto space-x-1 py-2">
                                {[
                                    { id: 'dashboard', label: 'Dashboard' },
                                    { id: 'inventory', label: 'Master Barang' },
                                    { id: 'transaction', label: 'Transaksi Masuk/Keluar' },
                                    { id: 'opname', label: 'Stock Opname' },
                                    { id: 'report', label: 'Laporan & Ekspor' },
                                ].map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition cursor-pointer ${
                                            activeTab === tab.id ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-900'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-medium text-slate-500 uppercase">Total Produk</p>
                                        <h3 className="text-2xl font-bold text-slate-900 mt-1">{products.length} Item</h3>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-medium text-slate-500 uppercase">Total Stok Fisik</p>
                                        <h3 className="text-2xl font-bold text-indigo-600 mt-1">{products.reduce((acc, p) => acc + Number(p.stock), 0).toLocaleString()} Unit</h3>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-medium text-slate-500 uppercase">Perlu Restock</p>
                                        <h3 className="text-2xl font-bold text-rose-600 mt-1">{products.filter(p => Number(p.stock) <= Number(p.minStock)).length} Item</h3>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-medium text-slate-500 uppercase">Total Transaksi</p>
                                        <h3 className="text-2xl font-bold text-emerald-600 mt-1">{transactions.length} Aktivitas</h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventory' && (
                            <div className="space-y-4">
                                <div className="flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                    <input 
                                        type="text" 
                                        placeholder="Cari nama barang..." 
                                        value={searchTerm} 
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full sm:w-72 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none"
                                    />
                                    <button 
                                        type="button"
                                        onClick={() => setIsAddModalOpen(true)} 
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition cursor-pointer"
                                    >
                                        + Barang Baru
                                    </button>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-100 text-slate-700 uppercase text-xs">
                                                <tr>
                                                    <th className="p-3.5">ID</th>
                                                    <th className="p-3.5">Nama Barang</th>
                                                    <th className="p-3.5">Kategori</th>
                                                    <th className="p-3.5 text-center">Satuan</th>
                                                    <th className="p-3.5 text-right">Stok Sistem</th>
                                                    <th className="p-3.5 text-right">Min Stock</th>
                                                    <th className="p-3.5 text-center">Status</th>
                                                    <th className="p-3.5 text-center">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {products.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase())).map(p => {
                                                    const isRestock = Number(p.stock) <= Number(p.minStock);
                                                    return (
                                                        <tr key={p.id} className="border-b hover:bg-slate-50 transition">
                                                            <td className="p-3.5 font-mono text-xs">{p.id}</td>
                                                            <td className="p-3.5 font-semibold text-slate-900">{p.name}</td>
                                                            <td className="p-3.5">{p.category}</td>
                                                            <td className="p-3.5 text-center"><span className="px-2 py-0.5 bg-slate-100 rounded text-xs font-medium">{p.unit}</span></td>
                                                            <td className="p-3.5 text-right font-bold text-slate-800">{Number(p.stock).toLocaleString()}</td>
                                                            <td className="p-3.5 text-right text-slate-500">{p.minStock}</td>
                                                            <td className="p-3.5 text-center">
                                                                <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${isRestock ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                                    {isRestock ? 'RESTOCK' : 'AMAN'}
                                                                </span>
                                                            </td>
                                                            <td className="p-3.5 text-center">
                                                                <div className="flex items-center justify-center gap-2">
                                                                    <button 
                                                                        type="button"
                                                                        onClick={() => handleOpenEditModal(p)} 
                                                                        className="text-indigo-600 hover:underline text-xs font-medium cursor-pointer bg-indigo-50 px-2.5 py-1 rounded-lg"
                                                                    >
                                                                        Edit
                                                                    </button>
                                                                    <button 
                                                                        type="button"
                                                                        onClick={() => handleDeleteProduct(p.id, p.name)} 
                                                                        className="text-rose-600 hover:underline text-xs font-medium cursor-pointer bg-rose-50 px-2.5 py-1 rounded-lg"
                                                                    >
                                                                        Hapus
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {products.length === 0 && (
                                                    <tr><td colSpan="8" className="p-8 text-center text-slate-400">Belum ada data barang. Silakan atur URL Google Sheets atau tambahkan barang baru.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'transaction' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1 h-fit">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Input Mutasi Barang</h3>
                                    <form onSubmit={handleTransactionSubmit} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Jenis Transaksi</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button type="button" onClick={() => setTrxForm({...trxForm, type: 'IN'})} className={`py-2 rounded-xl text-sm font-bold border cursor-pointer ${trxForm.type === 'IN' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-600'}`}>Masuk</button>
                                                <button type="button" onClick={() => setTrxForm({...trxForm, type: 'OUT'})} className={`py-2 rounded-xl text-sm font-bold border cursor-pointer ${trxForm.type === 'OUT' ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-50 text-slate-600'}`}>Keluar</button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Barang</label>
                                            <select value={trxForm.productName} onChange={(e) => setTrxForm({...trxForm, productName: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                                <option value="">-- Pilih Barang --</option>
                                                {products.map(p => (
                                                    <option key={p.id} value={p.name}>{p.name} (Stok: {p.stock} {p.unit})</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Jumlah (Qty)</label>
                                            <input type="number" min="1" value={trxForm.qty} onChange={(e) => setTrxForm({...trxForm, qty: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Pihak Terkait</label>
                                            <input type="text" value={trxForm.partner} onChange={(e) => setTrxForm({...trxForm, partner: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-semibold shadow cursor-pointer">Simpan Transaksi</button>
                                    </form>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Riwayat Transaksi</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-100 uppercase text-xs text-slate-700">
                                                <tr>
                                                    <th className="p-3">Tanggal</th>
                                                    <th className="p-3">Tipe</th>
                                                    <th className="p-3">Nama Barang</th>
                                                    <th className="p-3 text-right">Qty</th>
                                                    <th className="p-3">Pihak Terkait</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {transactions.map(t => (
                                                    <tr key={t.id} className="border-b hover:bg-slate-50">
                                                        <td className="p-3 text-xs">{t.date}</td>
                                                        <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${t.type === 'IN' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>{t.type}</span></td>
                                                        <td className="p-3 font-semibold">{t.productName}</td>
                                                        <td className="p-3 text-right font-bold">{t.qty} {t.unit}</td>
                                                        <td className="p-3 text-slate-500">{t.partner}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'opname' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h3 className="text-lg font-bold text-slate-800">Stock Opname Fisik</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm text-slate-600">
                                        <thead className="bg-slate-100 uppercase text-xs text-slate-700">
                                            <tr>
                                                <th className="p-3">Nama Barang</th>
                                                <th className="p-3">Kategori</th>
                                                <th className="p-3 text-center">Satuan</th>
                                                <th className="p-3 text-right">Stok Sistem</th>
                                                <th className="p-3 text-right">Stok Fisik Opname</th>
                                                <th className="p-3 text-right">Selisih</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {products.map(p => {
                                                const physical = opnameCounts[p.id] !== undefined ? Number(opnameCounts[p.id]) : Number(p.stock);
                                                const diff = physical - Number(p.stock);
                                                return (
                                                    <tr key={p.id} className="border-b hover:bg-slate-50">
                                                        <td className="p-3 font-semibold">{p.name}</td>
                                                        <td className="p-3">{p.category}</td>
                                                        <td className="p-3 text-center">{p.unit}</td>
                                                        <td className="p-3 text-right font-bold">{p.stock}</td>
                                                        <td className="p-3 text-right">
                                                            <input type="number" value={opnameCounts[p.id] !== undefined ? opnameCounts[p.id] : p.stock} onChange={(e) => setOpnameCounts({...opnameCounts, [p.id]: e.target.value})} className="w-24 bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-right text-sm font-bold" />
                                                        </td>
                                                        <td className={`p-3 text-right font-bold ${diff === 0 ? 'text-slate-500' : diff > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{diff > 0 ? `+${diff}` : diff}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'report' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <h3 className="text-lg font-bold text-slate-800">Modul Laporan & Filter Tanggal</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Jenis Laporan</label>
                                            <select value={reportType} onChange={(e) => setReportType(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                                <option value="master">Master Stok Barang</option>
                                                <option value="in">Transaksi Barang Masuk</option>
                                                <option value="out">Transaksi Barang Keluar</option>
                                                <option value="all">Semua Transaksi</option>
                                            </select>
                                        </div>
                                        {reportType !== 'master' && (
                                            <>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Awal</label>
                                                    <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Akhir</label>
                                                    <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    {!isDateValid && reportType !== 'master' && (
                                        <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 flex items-center gap-2">
                                            ⚠️ Mohon lengkapi Tanggal Awal & Tanggal Akhir dengan benar agar tombol download/cetak aktif.
                                        </div>
                                    )}

                                    <div className="flex flex-wrap gap-3 pt-2">
                                        <button 
                                            onClick={exportToCSV} 
                                            disabled={!isDateValid}
                                            className={`px-4 py-2.5 rounded-xl text-sm font-semibold shadow transition ${
                                                isDateValid ? 'bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                            }`}
                                        >
                                            📥 Download Spreadsheet (CSV)
                                        </button>
                                        <button 
                                            onClick={() => window.print()} 
                                            disabled={!isDateValid}
                                            className={`px-4 py-2.5 rounded-xl text-sm font-semibold shadow transition ${
                                                isDateValid ? 'bg-slate-800 hover:bg-slate-900 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                            }`}
                                        >
                                            🖨️ Print / Save PDF
                                        </button>
                                    </div>
                                </div>

                                <div id="printable-report" className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <div className="border-b pb-4">
                                        <h2 className="text-xl font-bold text-slate-900 uppercase">
                                            Laporan {reportType === 'master' ? 'Master Stok Barang' : reportType === 'in' ? 'Barang Masuk' : reportType === 'out' ? 'Barang Keluar' : 'Semua Transaksi'}
                                        </h2>
                                        {reportType !== 'master' && (
                                            <p className="text-xs text-slate-500 mt-1">Periode: {startDate} s/d {endDate}</p>
                                        )}
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            {reportType === 'master' ? (
                                                <>
                                                    <thead className="bg-slate-100 uppercase text-xs text-slate-700">
                                                        <tr>
                                                            <th className="p-3">ID</th>
                                                            <th className="p-3">Nama Barang</th>
                                                            <th className="p-3">Kategori</th>
                                                            <th className="p-3 text-center">Satuan</th>
                                                            <th className="p-3 text-right">Stok</th>
                                                            <th className="p-3 text-right">Min Stok</th>
                                                            <th className="p-3 text-center">Status</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {products.map(p => (
                                                            <tr key={p.id} className="border-b">
                                                                <td className="p-3 font-mono text-xs">{p.id}</td>
                                                                <td className="p-3 font-semibold">{p.name}</td>
                                                                <td className="p-3">{p.category}</td>
                                                                <td className="p-3 text-center">{p.unit}</td>
                                                                <td className="p-3 text-right font-bold">{p.stock}</td>
                                                                <td className="p-3 text-right">{p.minStock}</td>
                                                                <td className="p-3 text-center font-bold text-xs">{Number(p.stock) <= Number(p.minStock) ? 'RESTOCK' : 'AMAN'}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </>
                                            ) : (
                                                <>
                                                    <thead className="bg-slate-100 uppercase text-xs text-slate-700">
                                                        <tr>
                                                            <th className="p-3">ID Trx</th>
                                                            <th className="p-3">Tanggal</th>
                                                            <th className="p-3">Tipe</th>
                                                            <th className="p-3">Nama Barang</th>
                                                            <th className="p-3 text-right">Qty</th>
                                                            <th className="p-3">Pihak Terkait</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredTransactions.map(t => (
                                                            <tr key={t.id} className="border-b">
                                                                <td className="p-3 font-mono text-xs">{t.id}</td>
                                                                <td className="p-3">{t.date}</td>
                                                                <td className="p-3 font-bold">{t.type}</td>
                                                                <td className="p-3 font-semibold">{t.productName}</td>
                                                                <td className="p-3 text-right font-bold">{t.qty} {t.unit}</td>
                                                                <td className="p-3">{t.partner}</td>
                                                            </tr>
                                                        ))}
                                                        {filteredTransactions.length === 0 && (
                                                            <tr><td colSpan="6" className="p-6 text-center text-slate-400">Tidak ada data transaksi pada rentang tanggal tersebut.</td></tr>
                                                        )}
                                                    </tbody>
                                                </>
                                            )}
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL CONFIG */}
                    {isConfigOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                                <h3 className="font-bold text-lg text-slate-800">Pengaturan Google Sheets</h3>
                                <p className="text-xs text-slate-500">Masukkan URL Web App Google Apps Script Anda agar data tampil murni dari spreadsheet.</p>
                                <input type="url" placeholder="https://script.google.com/macros/s/.../exec" value={tempUrl} onChange={(e) => setTempUrl(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                <div className="flex justify-end pt-2">
                                    <button type="button" onClick={saveConfigUrl} className="px-4 py-2 text-sm bg-indigo-600 text-white rounded-xl font-semibold cursor-pointer">Simpan & Muat</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL TAMBAH BARANG BARU */}
                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                                <h3 className="font-bold text-lg text-slate-800">Tambah Barang Baru</h3>
                                <form onSubmit={handleAddProductSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Barang</label>
                                        <input type="text" placeholder="Contoh: CAT CHOIZE ADULT" value={newProduct.name} onChange={(e) => setNewProduct({...newProduct, name: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori</label>
                                            <select value={newProduct.category} onChange={(e) => setNewProduct({...newProduct, category: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                                <option value="Cat Food">Cat Food</option>
                                                <option value="Dog Food">Dog Food</option>
                                                <option value="Accessories">Accessories</option>
                                                <option value="Pakan Burung">Pakan Burung</option>
                                                 <option value="Pakan Ikan">Pakan Ikan</option>
                                                <option value="Pasir">Pasir</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Satuan</label>
                                            <select value={newProduct.unit} onChange={(e) => setNewProduct({...newProduct, unit: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                                <option value="BAL">BAL</option>
                                                <option value="DUS">DUS</option>
                                                <option value="SAK">SAK</option>
                                                <option value="PCS">PCS</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Stok Awal</label>
                                            <input type="number" min="0" value={newProduct.stock} onChange={(e) => setNewProduct({...newProduct, stock: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Min Stok</label>
                                            <input type="number" min="0" value={newProduct.minStock} onChange={(e) => setNewProduct({...newProduct, minStock: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded-xl cursor-pointer">Batal</button>
                                        <button type="submit" className="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow cursor-pointer">Simpan Barang</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT BARANG */}
                    {isEditModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                                <h3 className="font-bold text-lg text-slate-800">Edit Data Barang</h3>
                                <form onSubmit={handleUpdateProduct} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Barang</label>
                                        <input type="text" value={editingProduct.name} onChange={(e) => setEditingProduct({...editingProduct, name: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori</label>
                                            <select value={editingProduct.category} onChange={(e) => setEditingProduct({...editingProduct, category: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                                <option value="Cat Food">Cat Food</option>
                                                <option value="Dog Food">Dog Food</option>
                                                <option value="Accessories">Accessories</option>
                                                 <option value="Pakan Burung">Pakan Burung</option>
                                                 <option value="Pakan Ikan">Pakan Ikan</option>
                                                <option value="Pasir">Pasir</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Satuan</label>
                                            <select value={editingProduct.unit} onChange={(e) => setEditingProduct({...editingProduct, unit: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                                <option value="BAL">BAL</option>
                                                <option value="DUS">DUS</option>
                                                <option value="SAK">SAK</option>
                                                <option value="PCS">PCS</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Stok Sistem</label>
                                            <input type="number" min="0" value={editingProduct.stock} onChange={(e) => setEditingProduct({...editingProduct, stock: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Min Stok</label>
                                            <input type="number" min="0" value={editingProduct.minStock} onChange={(e) => setEditingProduct({...editingProduct, minStock: e.target.value})} required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsEditModalOpen(false)} className="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded-xl cursor-pointer">Batal</button>
                                        <button type="submit" className="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow cursor-pointer">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
